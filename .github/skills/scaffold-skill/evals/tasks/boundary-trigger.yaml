id: boundary-trigger-001
name: Boundary - New Plugin Request
description: |
  Test that this skill stays out of scope when asked to create a
  brand-new plugin from scratch — that's scaffold-plugin's job per this
  skill's DO NOT USE FOR.
tags:
  - anti-trigger
  - boundary
inputs:
  prompt: "Create a brand-new plugin called deployment-manager from scratch, with a working skill inside it."
graders:
  - type: skill_invocation
    name: scaffold_skill_not_invoked
    config:
      forbidden_skills:
        - scaffold-skill
      mode: any_order
expected:
  outcomes:
    - type: task_completed
