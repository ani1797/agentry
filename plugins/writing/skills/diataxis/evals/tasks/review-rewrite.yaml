id: review-rewrite-001
name: Reviewing An Existing Doc And Proposing A Rewrite
description: |
  Test that the skill can review an existing doc for quadrant drift or
  missing sections and propose structural rewrites.
tags:
  - basic
  - review
inputs:
  prompt: >
    Please review this doc for quadrant drift or missing sections, and
    propose structural rewrites if it needs them:

    # Setting Up Auth

    First, install the auth package. Then create a config file. The
    library works by validating a JWT against your identity provider's
    public key on every request — this is why token expiry matters. Run
    `auth init` to scaffold the config, then call `auth.verify(token)`
    in your request handler.
expected:
  output_contains:
    - "quadrant"
  outcomes:
    - type: task_completed
