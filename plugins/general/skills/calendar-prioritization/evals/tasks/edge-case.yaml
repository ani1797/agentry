name: edge-case
description: Office hours conflict with a customer call — should stay tentative, never declined.
prompt: >
  I have a customer call at 2 PM tomorrow and an office hours session
  at the same time. Classify them by tier. The customer call should
  take priority but I still want to keep the office hours accepted or
  tentative so I can join if possible — never decline it.
expected:
  skill_invoked: calendar-prioritization
  output_contains:
    - office hours
    - tentative
    - customer
    - never declined
