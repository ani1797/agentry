name: basic-usage
description: User asks to review and prioritize their calendar for the week.
prompt: >
  Review my calendar for next week. Protect my lunch, prioritize
  customer calls with [EXT] labels, flag any double-bookings with
  polite tentative notes and alternative times, and make sure I have
  at least 5 minutes between meetings.
expected:
  skill_invoked: calendar-prioritization
  output_contains:
    - lunch
    - "[EXT]"
    - tentative
    - buffer
