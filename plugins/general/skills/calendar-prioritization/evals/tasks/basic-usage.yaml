name: basic-usage
description: User asks to review and prioritize their calendar for the week.
prompt: >
  Review my calendar for next week. Protect my lunch from 12-1 PM,
  prioritize customer calls, and flag any double-bookings. Mark
  lower-priority conflicts as tentative with suggested alternative times.
expected:
  skill_invoked: calendar-prioritization
  output_contains:
    - lunch
    - customer
    - tentative
    - tier
